<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulacion de DOM</title>
    <script src="dom12-crud-productos.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .formulario {
            background-color: #eef4fb;
            border: 1px solid #b0fce8;
            padding: 20px;
            margin-top: 20px;
        }

        .formulario input {
            margin: 5px;
            padding: 8px;
            width: 200px;
        }

        .formulario input {
            width: 100px;
            margin: 5px;
            margin-bottom: 8px;
        }

        .btn-agregar:hover {
            background-color: #4CAF50;
            color: white;
        }

        .btn-cancelar:hover {
            background-color: crimson;
            color: white;
        }
        .stat-card {
            display: inline-block;
            width: 200px;
            padding: 15px;
            margin: 10px;
            background-color: #80dcec;
            border: 1px solid #ea3a3a;
            border-radius: 5px;
            text-align: center;
        }
        .stat-card h3 {
            margin-bottom: 10px;
            color: #555;
        }
    </style>
</head>

<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2>Crud Productos</h2>
    <div id="stats">
        <div class="stat-card">
            <h3>Total Productos</h3>
            <p id="totalProductos">0</p>
        </div>
        <div class="stat-card">
            <h3>Precio Promedio</h3>
            <p id="precioPromedio">0</p>
        </div>
        <div class="stat-card">
            <h3>Producto Mas Caro</h3>
            <p id="productoMasCaro">0</p>
        </div>
        <div class="stat-card">
            <h3>Producto Mas Barato</h3>
            <p id="productoMasBarato">0</p>
        </div>
    </div>
    <div class="formulario">
        <h3>Agregar Nuevo Producto</h3>
        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" placeholder="Nombre del producto">
        <label for="descripcion">Descripción:</label>
        <input id="descripcion" type="text" placeholder="Descripción del producto">
        <label for="precio">Precio:</label>
        <input id="precio" type="number" placeholder="precio del producto">
        <button id="btn_agregar" class="btn-agregar">Agregar Prodcuto</button>
        <button id="btn_cancelar" class="btn-cancelar">Cancelar</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>

</body>

</html>
