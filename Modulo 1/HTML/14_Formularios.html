<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
</head>
<body>
    <h1>Formularios en HTML</h1>
    <form action="/procesar" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </td>
                <td>
                    <label for="email">Correo Electrónico:
                        <br>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </td>
                <td>
                    <label for="sitio web">Sitio Web:</label><br>
                    <input type="url" id="sitio web" name="sitio web" placeholder="https://www.ejemplo.com">
                </td>
            </tr>            
            <tr>
                <td>
                    <label for="telefono">Teléfono:</label><br>
                    <input type="tel" id="telefono" name="telefono" placeholder="Tu número de teléfono">
                </td>
                <td>
                    <label for="buscar">Buscar:</label><br>
                    <input type="search" id="buscar" name="buscar" placeholder="Buscar...">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad" min="0" max="120" placeholder="Tu edad"> 
                </td>
                <td>
                    <label for="volumen">Volumen:<span id="volumen-value">50</span></label><br>
                    <input type="range" id="volumen" name="volumen" min="0" max="100" value="50" 
                    oninput="document.getElementById('volumen-value').textContent = this.value">
                </td>
            </tr>
            <!-- Tipo fecha-->
            <tr>
                <td colspan="2">
                    <h3>Tipos de fechas</h3> 
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fecha">Fecha de Nacimiento</label><br>
                    <input type="data" id="fecha" name="fecha">
                </td>
                <td>
                    <label for="fecha">Hora de la cita</label><br>
                    <input type="time" id="hora" name="hora">
                </td>
            </tr>
                <td>
                    <label for="evento">Inicio del evento</label><br>
                    <input type="datetime-local" id="evento" name="evento">
                </td>
                <td>
                    <label for="mes">Mes de Inicio</label><br>
                    <input type="Mounth" id="mes" name="mes">
                </td>
            </tr>

            <!-- Checkbox y option-->
            <tr>
                <td colspan="2">
                    <h3>Checkbox y option</h3> 
                </td>
            </tr>
            <tr>
                <td>
                    <input type="checkbox" id="acepto" name="acepto" value="si">
                    <label for="acepto">Acepto los terminos y condiciones</label><br>
                </td>
                <td>
                    <fieldset>
                        <legend>
                            Metodo de pago
                        </legend>
                        <input type="radio" id="tarjeta" name="pago" value="tarjeta">
                        <label for="tarjeta">Tarjeta de credito</label>
                        <input type="radio" id="paypal" name="pago" value="paypal">
                        <label for="paypal">paypal</label><br>
                        <input type="radio" id="transferencia" name="pago" value="transferencia">
                        <label for="transferencia">Transferencia</label>
                    </fieldset>
                </td>
            </tr>

            <!-- utiles-->
            <tr>
                <td colspan="2">
                    <h1>Utiles</h1> 
                </td>
            </tr>
            <tr>
                <td>
                    <label for="color">Color</label><br>
                    <input type="color" id="color" name="color" value="#3b82f6">
                </td>

                <td>
                    <label for="foto">Foto de perfil</label>
                    <input type="file" id="foto" name="foto" value="image/">
                </td>

                <td>
                    <label for="docs">Documento</label>
                    <input type="file" id="docs" name="docs" value=".pdf, .doc, .docx">
                </td>

                <td>
                    <input type="hidden" id="token" name="token" value="abcd123xyz">
                </td>
            </tr>

            <!-- TextArea y select -->
            <tr>
                <td colspan="2">
                    <h1>Textarea y Select</h1> 
                </td>
            </tr>
            <tr>
                <td>
                    <label for="mensaje">Mensaje</label><br>
                    <textarea id="mensaje"
                        name="mensaje"
                        rows="6
                        cols="50"
                        placeholder="Escribe tu mensaje aqui""></textarea>
                </td>

                <td>
                    <!-- Select Basico -->
                    <label for="Pais">Pais</label>
                    <select id="pais" name="pais">
                        <option value="">--Seleciona el Pais--</option>
                        <option value="co">Colombia</option>
                        <option value="ec">Ecuador</option>
                        <option value="es">España</option>
                        <option value="ve">Venezuela</option>
                    </select>
                </td>
            </tr>
                <td>
                    <!-- Select con optgroup -->
                    <label for="ciudad">Ciudades</label>
                    <select id="ciudad" name="ciudad">
                        <optgroup label="España">
                            <option value="mad">Madrid</option>
                            <option value="bar">Barcelona</option>
                            <option value="sev">Sevilla</option>
                        </optgroup>

                        <optgroup label="Mexico">
                            <option value="cdm">Ciudad de Mexico</option>
                            <option value="gdl">Guadalajara</option>
                        </optgroup>

                        <optgroup label="Venezuela">
                            <option value="cor">Coro</option>
                            <option value="mrc">Macaraibo</option>
                        </optgroup>
                    </select>
                </td>

                <td>
                    <!-- Select multiple -->
                    <label for="skill">Habilidades</label>
                    <select id="skill" name="habilidades" multiple size="4">
                        <option value="html5">HTML5</option>
                        <option value="css3">CSS3</option>
                        <option value="js">JavaScript</option>
                        <option value="ts">TypeScript</option>
                    </select>
                </td>
        </table>
        <button type="submit">Enviar</button>
    </form> 
</body>
</html>
