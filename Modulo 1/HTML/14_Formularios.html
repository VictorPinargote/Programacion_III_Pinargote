<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
</head>
<body>
    <h1>Formularios en HTML</h1>
    <form action="/procesar" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </td>
                <td>
                    <label for="email">Correo Electrónico:
                        <br>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </td>
                <td>
                    <label for="sitio web">Sitio Web:</label><br>
                    <input type="url" id="sitio web" name="sitio web" placeholder="https://www.ejemplo.com">
                </td>
            </tr>            
            <tr>
                <td>
                    <label for="telefono">Teléfono:</label><br>
                    <input type="tel" id="telefono" name="telefono" placeholder="Tu número de teléfono">
                </td>
                <td>
                    <label for="buscar">Buscar:</label><br>
                    <input type="search" id="buscar" name="buscar" placeholder="Buscar...">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad" min="0" max="120" placeholder="Tu edad"> 
                </td>
                <td>
                    <label for="volumen">Volumen:<span id="volumen-value">50</span></label><br>
                    <input type="range" id="volumen" name="volumen" min="0" max="100" value="50" 
                    oninput="document.getElementById('volumen-value').textContent = this.value">
                </td>
            </tr>
    </form> 
</body>
</html>
